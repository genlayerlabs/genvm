# yaml-language-server: $schema=../../../doc/schemas/default-config.json#genvm
# yaml-language-server: $schema=https://raw.githubusercontent.com/genlayerlabs/genvm/refs/heads/main/doc/schemas/default-config.json#genvm
modules:
  llm:
    address: ws://127.0.0.1:3031
  web:
    address: ws://127.0.0.1:3032

fees:
  # Required host-provided `node` fields (from gas_data):
  #   node.storageUnitPrice       - price per storage page
  #   node.receiptGasPerByte      - price per receipt/output byte
  #   node.gasPerChangedSlot      - price per changed storage slot
  #   node.intrinsicGas           - per-tx intrinsic gas
  #   node.bootloaderOverhead     - per-tx bootloader overhead
  #   node.fixedProposeReceiptGas - fixed cost of a propose receipt
  #   node.fixedMessageRevealGas  - fixed cost of a message reveal
  #   node.genPerTimeUnit         - GEN per time unit (0 disables the time term)
  # Optional:
  #   node.validatorsPerRound[]   - validator count per round
  #                                 (defaults to defaultValidatorsPerRound below)
  expr_prelude: |
    let Y = \f = (\x = f (\v = x x v)) (\x = f (\v = x x v)) in
    let fold = \arr acc fn =
        Y (\go i a =
            if i >= arrayLen arr then a
            else go (i + 1) (fn a (arrayGetElem arr i))
        ) 0 acc in
    let foldRange = \lo hi acc fn =
        Y (\go i a =
            if i >= hi then a
            else go (i + 1) (fn a i)
        ) lo acc in
    let ceilDiv = \a b = floor ((a + b - 1) / b) in
    let idiv = \a b = floor (a / b) in

    let u256Max = pow 2 256 - 1 in

    # validators per round; falls back to the governance default table when
    # the node does not provide node.validatorsPerRound
    let defaultValidatorsPerRound =
      [5, 7, 11, 13, 23, 25, 47, 49, 95, 97, 191, 193, 383, 385, 767, 769, 1535, 1537] in
    let validatorsPerRound =
      if hasKey node "validatorsPerRound" then node.validatorsPerRound
      else defaultValidatorsPerRound in
    # leaf-node message fee floor = minPrimaryFees * lifecycleMultiplier
    # feeParams: object { leaderTimeunitsAllocation,
    #   validatorTimeunitsAllocation, executionBudgetPerRound, rotations[] }
    # appealRounds = len(rotations) - 1
    # onAcceptance: per-message lifecycle flag (bool)
    # uses validatorsPerRound[] (node or default), node.genPerTimeUnit
    let messageFeeFloor = \feeParams onAcceptance =
      let rotations = feeParams.rotations in
      let appealRounds = arrayLen rotations - 1 in
      let leaderTU = feeParams.leaderTimeunitsAllocation in
      let validatorTU = feeParams.validatorTimeunitsAllocation in
      let execBudgetPerRound = feeParams.executionBudgetPerRound in
      # round parity: odd when round - 2*(round/2) == 1
      let isOdd = \n = n - 2 * idiv n 2 == 1 in
      # 1. rotation count per round
      let rotationsForRound = \round =
        if round == 0 then arrayGetElem rotations 0 + 1
        else if isOdd round then 1
        else arrayGetElem rotations (idiv round 2) + 1 in
      # 2. consensus (time) term, round = 0 .. 2*appealRounds
      let consensusTerm = foldRange 0 (2 * appealRounds + 1) 0 (\acc round =
        acc + rotationsForRound round
            * (leaderTU + arrayGetElem validatorsPerRound round * validatorTU)) in
      # 3. leader rounds = (Σ i=0..appealRounds (rotations[i]+1)) + appealRounds
      let leaderRounds =
        foldRange 0 (appealRounds + 1) 0 (\acc i = acc + arrayGetElem rotations i + 1)
          + appealRounds in
      # 4. execution-budget term
      let executionTerm = execBudgetPerRound * leaderRounds in
      # 5. minimum primary fees (caps forced to zero by construction)
      let minPrimaryFees =
        (if node.genPerTimeUnit > 0 then node.genPerTimeUnit * consensusTerm else consensusTerm)
          + executionTerm in
      # 6. lifecycle multiplier
      let lifecycleMultiplier = if onAcceptance then appealRounds + 1 else 1 in
      minPrimaryFees * lifecycleMultiplier
    in
  storage:
    bucket_no: 0
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a = a.pages * node.storageUnitPrice
  message_receipt:
    bucket_no: 0
    subtract_on_start_expr: |
      node.fixedProposeReceiptGas # for propose
        + node.intrinsicGas
        + node.bootloaderOverhead
        + 7 * node.gasPerChangedSlot
        + node.fixedMessageRevealGas # for reveal
        + node.intrinsicGas
        + node.bootloaderOverhead
        + 32 * node.gasPerChangedSlot # for 32 bytes of length
    delta_expr: |
      \a =
      # each `bytes` field is indirection + length + data, rounded up to 32 bytes
      let calldataBytes = 32 + 32 + ceilDiv a.calldataLength 32 * 32 in
      # allocationSubtree the leader carries in the receipt under commitment modes
      # (empty for external messages -> just the 64-byte indirection + length)
      let subtreeBytes = 32 + 32 + ceilDiv a.subtreeLength 32 * 32 in
      (calldataBytes + subtreeBytes) * node.receiptGasPerByte + 1 * node.gasPerChangedSlot
  nondet_output:
    bucket_no: 0
    subtract_on_start_expr: |
      32 * node.receiptGasPerByte # for 32 bytes of length
    delta_expr: |
      \a = (32 + 32 + ceilDiv a.outputLength 32 * 32) * node.receiptGasPerByte # bytes are indirection + length + data, rounded up to 32 bytes
  message_fee:
    bucket_no: 1
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a =
      if a.isInternal
      then messageFeeFloor a.matchedFeeParams a.onAcceptance
      # external messages reserve the worst-case L1 gas cost: gasLimit * maxGasPrice
      # (matches the chain's `budget == k * (gasLimit * maxGasPrice)` requirement)
      else a.matchedFeeParams.gasLimit * a.matchedFeeParams.maxGasPrice
  event:
    bucket_no: 0
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a = (a.topicsCount + ceilDiv a.blobSize 32) * node.storageUnitPrice

threads: 2
blocking_threads: 4
log_disable: genvm::rt::memlimiter

cache_dir: ${exeDir}/../.cache/
runners_dir: ${exeDir}/../../../runners/
registry_dir: ${exeDir}/../data
