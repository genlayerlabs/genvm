name: GenVM full

# Full GenVM CI. The repo has NO GitHub merge queue: this runs directly on
# every PR targeting a dev branch (v<X>-dev) and is the authoritative
# "genvm CI" gate the /merge comment (branch_merge_into_dev.yaml) requires to be green on
# the exact head commit it fast-forwards.
on:
  pull_request:
    branches: ['v*-dev']
    types: [opened, synchronize, reopened, ready_for_review]
defaults:
  run:
    shell: bash -x {0}

env:
  GCS_BUCKET: "gh-af"

jobs:
  initial:
    uses: ./.github/workflows/incl_initial.yaml
    secrets: inherit

  module-test-python:
    needs: [initial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          load_submodules: "false"
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./support/ci/pipelines/test-python.sh

  module-test-rust-fuzz:
    needs: [initial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses:  insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          load_submodules: "true"
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          ./support/ci/pipelines/test-rust-fuzz.sh && ./support/ci/cargo-clippy.sh
        env:
          OPENAIKEY: ${{ secrets.OPENAIKEY }}
          HEURISTKEY: ${{ secrets.HEURISTKEY }}
          ANTHROPICKEY: ${{ secrets.ANTHROPICKEY }}
          XAIKEY: ${{ secrets.XAIKEY }}
          GEMINIKEY: ${{ secrets.GEMINIKEY }}

  module-test-rust:
    needs: [initial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses:  insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          load_submodules: "true"
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK # needed for gcloud to upload runners to GCS for caching
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: |
          ./support/ci/pipelines/test-rust.sh
        env:
          OPENAIKEY: ${{ secrets.OPENAIKEY }}
          HEURISTKEY: ${{ secrets.HEURISTKEY }}
          ANTHROPICKEY: ${{ secrets.ANTHROPICKEY }}
          XAIKEY: ${{ secrets.XAIKEY }}
          GEMINIKEY: ${{ secrets.GEMINIKEY }}

  validate-end:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - initial
      - module-test-python
      - module-test-rust
      - module-test-rust-fuzz
    steps:
      - name: check
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          if echo "$results" | grep -qiE '(failure|cancelled)'; then
            echo "One or more jobs failed/cancelled"
            exit 1
          fi
