name: GenVM full
on:
  merge_group:
defaults:
  run:
    shell: bash -x {0}

env:
  GCS_BUCKET: "gh-af"

jobs:
  initial:
    uses: ./.github/workflows/inc_initial.yaml
    secrets: inherit

  module-test-python:
    needs: [initial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          load_submodules: "false"
          with_nix: "true"
      - run: ./support/ci/pipelines/test-python.sh

  module-test-rust:
    needs: [initial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          load_submodules: "false"
          with_nix: "true"
      - name: Set up Cloud SDK # needed for gcloud to upload runners to GCS for caching
        uses: google-github-actions/setup-gcloud@v2
      - run: ./support/ci/pipelines/test-rust.sh && ./support/ci/cargo-clippy.sh

  validate-end:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - initial
      - module-test-python
      - module-test-rust
    steps:
      - name: check
        run: |
          echo ${{ join(needs.*.result, ' ') }} | grep -vP 'failure|cancelled'
