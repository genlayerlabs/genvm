name: branch / e2e (dev -> version)

# Release gate for the standing v<X>-dev -> v<X>.x PR: the full
# cross-repo E2E matrix runs here and must be green before dev merges
# into the release-ready version branch.
#
# STUB for now — the real cross-repo E2E pipeline (genlayerlabs/
# genlayer-e2e) will be wired in here later. Until then the `e2e` job is
# a placeholder pass, but the `guard` already enforces that only a
# v<X>-dev branch may target a version branch.

on:
  pull_request:
    branches: ['v*.x']

permissions:
  contents: read

defaults:
  run:
    shell: bash -x {0}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev -> version only
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          case "$HEAD" in
            v*-dev) echo "ok: ${HEAD} -> ${BASE}" ;;
            *)
              echo "::error::Only v<X>-dev branches may target a version branch (${BASE}); got '${HEAD}'"
              exit 1
              ;;
          esac

  e2e:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - name: E2E stub
        run: |
          echo "E2E ${{ github.head_ref }} -> ${{ github.base_ref }} gate is STUBBED — passing."
          echo "TODO: dispatch the genlayer-e2e cross-repo matrix and gate on its result."
