name: branch / merge-queue target guard

# The merge queue may only merge into a dev branch (v<X>-dev). Any PR
# whose target resolves to a non-dev branch (main, a version branch, a
# feature branch) fails here, so the queue stays the single funnel into
# the integration branches.
#
# Runs alongside the full GenVM merge_group checks (queue.yaml); a
# failure here fails the merge_group regardless of those results.

on:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash -x {0}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require merge-queue target to be a dev branch
        run: |
          BASE="${{ github.event.merge_group.base_ref }}"
          NAME="${BASE#refs/heads/}"
          case "$NAME" in
            v*-dev) echo "ok: merging into dev branch ${NAME}" ;;
            *)
              echo "::error::Merge queue may only target v<X>-dev branches; got '${NAME}'"
              exit 1
              ;;
          esac
