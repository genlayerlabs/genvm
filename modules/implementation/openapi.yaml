openapi: 3.0.3
info:
  title: GenVM Manager API
  version: 1.0.0
  description: |
    REST API for managing GenVM execution instances, modules, and configurations.

    The GenVM Manager is responsible for:
    - Managing GenVM execution instances and their lifecycle
    - Controlling LLM and Web modules
    - Version detection and contract management
    - Runtime configuration and monitoring
  contact:
    name: GenLayer
    url: https://docs.genlayer.com

servers:
  - url: http://127.0.0.1:3999
    description: Default local server

tags:
  - name: Status
    description: Service status and health checks
  - name: Modules
    description: Module lifecycle management (LLM, Web)
  - name: GenVM
    description: GenVM execution instance management
  - name: Contracts
    description: Contract deployment and version detection
  - name: Configuration
    description: Runtime configuration management
  - name: LLM
    description: LLM provider availability testing

paths:
  /status:
    get:
      tags:
        - Status
      summary: Get service status
      description: Returns the current status of LLM and Web modules
      operationId: getStatus
      responses:
        '200':
          description: Service status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm_module:
                    $ref: '#/components/schemas/ModuleStatus'
                  web_module:
                    $ref: '#/components/schemas/ModuleStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /module/start:
    post:
      tags:
        - Modules
      summary: Start a module
      description: Starts the specified module (LLM or Web)
      operationId: startModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartModuleRequest'
      responses:
        '200':
          description: Module started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "module_started"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /module/stop:
    post:
      tags:
        - Modules
      summary: Stop a module
      description: Stops the specified module (LLM or Web)
      operationId: stopModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - module_type
              properties:
                module_type:
                  $ref: '#/components/schemas/ModuleType'
      responses:
        '200':
          description: Module stop result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [module_stopped, module_not_running]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genvm/run:
    post:
      tags:
        - GenVM
      summary: Start a GenVM execution instance
      description: Starts a new GenVM instance with the specified configuration
      operationId: runGenVM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenVMRunRequest'
      responses:
        '200':
          description: GenVM instance started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "started"
                  id:
                    type: integer
                    format: int64
                    description: Unique ID of the started GenVM instance
                    example: 42
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genvm/run/readonly:
    post:
      tags:
        - GenVM
      summary: Run GenVM in readonly mode
      description: Executes contract code in readonly mode (not yet implemented)
      operationId: runGenVMReadonly
      parameters:
        - name: Deployment-Timestamp
          in: header
          required: true
          schema:
            type: string
            format: date-time
          description: RFC3339 formatted deployment timestamp
          example: "2024-01-01T00:00:00Z"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Contract code bytes
      responses:
        '200':
          description: Contract schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genvm/{id}:
    get:
      tags:
        - GenVM
      summary: Get GenVM execution status
      description: Retrieves the status of a GenVM execution instance and removes it from tracking
      operationId: getGenVMStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: GenVM instance ID
      responses:
        '200':
          description: GenVM status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  genvm_id:
                    type: integer
                    format: int64
                  status:
                    $ref: '#/components/schemas/GenVMStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - GenVM
      summary: Gracefully shutdown a GenVM instance
      description: Sends SIGTERM to the GenVM process and waits for graceful shutdown, sends SIGKILL if timeout is exceeded
      operationId: shutdownGenVM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: GenVM instance ID
        - name: wait_timeout_ms
          in: query
          schema:
            type: integer
            format: int64
            default: 30000
          description: Maximum time to wait for graceful shutdown in milliseconds
      responses:
        '200':
          description: Shutdown result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      result:
                        type: string
                        example: "shutdown_completed"
                      genvm_id:
                        type: integer
                        format: int64
                  - type: object
                    properties:
                      error:
                        type: string
                      genvm_id:
                        type: integer
                        format: int64
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contract/detect-version:
    post:
      tags:
        - Contracts
      summary: Detect contract version
      description: Analyzes contract code to detect the specified major version
      operationId: detectContractVersion
      parameters:
        - name: Deployment-Timestamp
          in: header
          required: true
          schema:
            type: string
            format: date-time
          description: RFC3339 formatted deployment timestamp
          example: "2024-01-01T00:00:00Z"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Contract code bytes
      responses:
        '200':
          description: Version detected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  specified_major:
                    type: integer
                    format: uint32
                    description: Detected major version number
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contract/pre-deploy-writes:
    post:
      tags:
        - Contracts
      summary: Generate pre-deployment storage writes
      description: Generates the storage writes needed before deploying a contract
      operationId: makeDeploymentStorageWrites
      parameters:
        - name: Deployment-Timestamp
          in: header
          required: true
          schema:
            type: string
            format: date-time
          description: RFC3339 formatted deployment timestamp
          example: "2024-01-01T00:00:00Z"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Contract code bytes
      responses:
        '200':
          description: Storage writes generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  writes:
                    type: array
                    items:
                      type: array
                      items:
                        oneOf:
                          - type: string
                            format: base64
                            description: Storage key (36 bytes, base64 encoded)
                          - type: string
                            format: base64
                            description: Storage value (base64 encoded)
        '500':
          $ref: '#/components/responses/InternalServerError'

  /log/level:
    post:
      tags:
        - Configuration
      summary: Set log level
      description: Dynamically changes the logging level
      operationId: setLogLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - level
              properties:
                level:
                  type: string
                  enum: [error, warn, info, debug, trace]
                  description: New log level
      responses:
        '200':
          description: Log level set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "log_level_set"
                  level:
                    type: string
                    example: "debug"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /manifest/reload:
    post:
      tags:
        - Configuration
      summary: Reload version manifest
      description: Reloads the executor version manifest from disk
      operationId: reloadManifest
      responses:
        '200':
          description: Manifest reloaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "manifest_reloaded"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /env:
    post:
      tags:
        - Configuration
      summary: Set environment variable
      description: Sets an environment variable at runtime
      operationId: setEnvironmentVariable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
              properties:
                key:
                  type: string
                  description: Environment variable name
                  example: "GENVM_DEBUG"
                value:
                  type: string
                  description: Environment variable value
                  example: "true"
      responses:
        '200':
          description: Environment variable set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "env_var_set"
                  key:
                    type: string
                    example: "GENVM_DEBUG"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permits:
    get:
      tags:
        - Configuration
      summary: Get concurrent execution permits
      description: Returns the current number of concurrent GenVM execution permits
      operationId: getPermits
      responses:
        '200':
          description: Permits retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  permits:
                    type: integer
                    format: uint
                    description: Current number of concurrent execution permits
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Configuration
      summary: Set concurrent execution permits
      description: Changes the number of concurrent GenVM execution permits (minimum 2)
      operationId: setPermits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permits
              properties:
                permits:
                  type: integer
                  format: uint
                  minimum: 2
                  description: New number of concurrent execution permits
      responses:
        '200':
          description: Permits set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "permits_set"
                  permits:
                    type: integer
                    format: uint
                    description: Actual number of permits after the operation
        '500':
          $ref: '#/components/responses/InternalServerError'

  /llm/check:
    post:
      tags:
        - LLM
      summary: Check LLM provider availability
      description: Tests multiple LLM provider configurations with test prompts
      operationId: checkLLMAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMCheckRequest'
      responses:
        '200':
          description: LLM availability check results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMAvailabilityResult'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ModuleType:
      type: string
      enum: [Llm, Web]
      description: Type of module

    ModuleStatus:
      type: object
      nullable: true
      description: Status of a module (null if not running)
      additionalProperties: true

    StartModuleRequest:
      type: object
      required:
        - module_type
      properties:
        module_type:
          $ref: '#/components/schemas/ModuleType'
        # Additional module-specific configuration fields

    GenVMRunRequest:
      type: object
      required:
        - major
        - message
        - is_sync
        - capture_output
        - host_data
        - timestamp
        - host
      properties:
        major:
          type: integer
          format: uint32
          description: Major version of the executor to use
        message:
          type: object
          description: Execution message/payload (JSON object)
        is_sync:
          type: boolean
          description: Whether to run in synchronous mode (uses 1 permit instead of 2)
        capture_output:
          type: boolean
          description: Whether to capture stdout/stderr
        max_execution_minutes:
          type: integer
          format: uint64
          default: 50
          description: Maximum execution time in minutes
        host_data:
          type: string
          description: Host-specific data (JSON string)
          example: '{"tx_id": "0x123", "node_address": "0xabc"}'
        timestamp:
          type: string
          format: date-time
          description: Execution timestamp (RFC3339 format)
        host:
          type: string
          description: Host identifier
        extra_args:
          type: array
          items:
            type: string
          default: []
          description: Additional command-line arguments for the executor

    GenVMStatus:
      type: object
      nullable: true
      description: GenVM execution status (null if still running)
      properties:
        finished_at:
          type: integer
          format: uint64
          description: Milliseconds elapsed since finish time
        stdout:
          type: string
          description: Captured stdout (if capture_output was true)
        stderr:
          type: string
          description: Captured stderr (if capture_output was true)

    LLMProvider:
      type: string
      enum: [OpenAI, Anthropic, Ollama, Heurist]
      description: LLM provider type

    LLMCheckRequest:
      type: object
      required:
        - configs
        - test_prompts
      properties:
        configs:
          type: array
          description: List of LLM provider configurations to test
          items:
            type: object
            required:
              - host
              - provider
              - model
              - key
            properties:
              host:
                type: string
                description: Provider API host URL
                example: "https://api.openai.com/v1"
              provider:
                $ref: '#/components/schemas/LLMProvider'
              model:
                type: string
                description: Model name/identifier
                example: "gpt-4"
              key:
                type: string
                description: API key for authentication
        test_prompts:
          type: array
          description: Test prompts to execute against each configuration
          items:
            type: object
            description: Internal prompt format
            # The actual structure depends on llm::prompt::Internal

    LLMAvailabilityResult:
      type: object
      required:
        - config_index
        - prompt_index
        - available
      properties:
        config_index:
          type: integer
          format: uint
          description: Index of the tested configuration
        prompt_index:
          type: integer
          format: uint
          description: Index of the tested prompt
        available:
          type: boolean
          description: Whether the LLM provider is available
        error:
          type: string
          nullable: true
          description: Error message if unavailable
        response:
          type: string
          nullable: true
          description: LLM response if available

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message

  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
