[package]
name = "genvm-modules-interfaces"
version = "0.1.0"
edition = "2021"

[dependencies]
genlayer_sdk = { path = "../../executor/crates/sdk-rs", default-features = false }
anyhow = "1.0.97"
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync"], default-features = false}
serde = { version = "1.0.219", features = ["rc", "derive"] }
serde_json = "1.0.140"
serde_derive = "1.0.219"
regex = { version = "1.11.1", default-features = false, features = ["std"] }
serde_bytes = "0.11.17"
genlayer_calldata = { path = "../../executor/crates/calldata" }
num-bigint = "0.4"
num-traits = "0.2"
primitive-types = { version = "0.13", features = ["impl-serde"] }
